# Experimental only. No weights trained; approval and corpus review required first.
model: training/artifacts/qwen17_mlx
data: training/dadi_draft
train: true
fine_tune_type: lora
num_layers: 4
batch_size: 1
iters: 20
learning_rate: 0.0001
steps_per_report: 5
steps_per_eval: 20
val_batches: 9
adapter_path: training/artifacts/dadi_qwen17_pilot
save_every: 20
max_seq_length: 512
grad_checkpoint: true
grad_accumulation_steps: 1
mask_prompt: true
seed: 42
report_to: null
trust_remote_code: false
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05
  keys:
    - self_attn.q_proj
    - self_attn.v_proj
